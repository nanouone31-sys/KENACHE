<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12463F">
<title>كناش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Naskh Arabic',system-ui,sans-serif;
  --paper:#F3F1EC; --card:#FFFFFF; --sunk:#F7F5F0;
  --ink:#18221F; --ink-2:#4A5651; --ink-3:#86918C;
  --line:#E6E1D8; --line-2:#D5CFC4;
  --brand:#12463F; --brand-2:#0B302B; --brand-soft:#E2EDE9; --on-brand:#fff;
  --profit:#1D7A4B; --profit-soft:#E1F1E7;
  --wait:#9F6108;   --wait-soft:#FBEFD8;
  --loss:#B03A2E;   --loss-soft:#FBE3DF;
  --info:#2D5D9C;   --info-soft:#E3EBF6;
  --rule:rgba(255,255,255,.07); --margin:#D86A50;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --tabbar:66px; --side:248px;
  --shadow:0 1px 2px rgba(24,34,31,.04),0 4px 14px rgba(24,34,31,.05);
}
[data-theme="dark"]{
  --paper:#0E1412; --card:#151D1A; --sunk:#111816;
  --ink:#E7EDEA; --ink-2:#ADB9B3; --ink-3:#7B8882;
  --line:#22302B; --line-2:#31403A;
  --brand:#5CC2A8; --brand-2:#7DD3BD; --brand-soft:#16322C; --on-brand:#06201A;
  --profit:#55CC8E; --profit-soft:#14301F;
  --wait:#E6B24E;   --wait-soft:#33290F;
  --loss:#F07A6E;   --loss-soft:#3A1C18;
  --info:#82AEE6;   --info-soft:#16283F;
  --shadow:0 1px 2px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;min-height:100vh;
  padding-bottom:calc(var(--tabbar) + 28px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.n{unicode-bidi:isolate;direction:ltr;display:inline-block}
.cur{font-size:.7em;margin-inline-start:.3em;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2);font-size:13px}
.pos{color:var(--profit)} .neg{color:var(--loss)} .wait{color:var(--wait)}
.hide{display:none!important}

/* ---------- Shell ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:6px;height:60px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset-block:0;inset-inline-end:7px;width:1.5px;background:var(--margin)}
.brand .bt{min-width:0}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--ink-3)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);position:relative;transition:background .15s,color .15s}
.iconbtn:hover{background:var(--brand-soft);color:var(--brand)}
.iconbtn .dot{position:absolute;top:8px;inset-inline-start:8px;width:9px;height:9px;border-radius:50%;background:var(--ink-3);border:2px solid var(--paper)}
.iconbtn .dot.ok{background:var(--profit)} .iconbtn .dot.err{background:var(--loss)} .iconbtn .dot.busy{background:var(--info)}
.spin{animation:spin .9s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
main{padding-top:18px;padding-bottom:8px;min-height:60vh}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar);padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-3);font-weight:500;position:relative}
.tab .pill{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .18s,color .18s}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--brand-soft)}
.badge-n{position:absolute;top:5px;inset-inline-start:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--loss);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-style:normal}
.fab{position:fixed;z-index:31;inset-inline-end:max(16px,calc((100vw - 760px)/2 + 16px));bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom));
  height:54px;padding:0 22px 0 20px;border-radius:27px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:8px;font-weight:700;
  box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 40%,transparent);transition:transform .15s}
.fab:active{transform:scale(.96)}

/* Desktop sidebar */
.side{display:none}
@media (min-width:1000px){
  body{padding-inline-start:var(--side);padding-bottom:40px}
  .tabbar{display:none}
  .wrap{max-width:1120px;padding:0 28px}
  .side{display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;width:var(--side);background:var(--card);border-inline-end:1px solid var(--line);padding:18px 14px;z-index:25}
  .side .brand{flex:none;padding:4px 8px 18px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 12px;border-radius:12px;font-size:14.5px;color:var(--ink-2)}
  .side .tab .pill{width:auto;height:auto;background:none!important}
  .side .tab:hover{background:var(--sunk)}
  .side .tab[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  .side .badge-n{position:static;margin-inline-start:auto}
  .side .status{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .topbar .brand .logo{display:none}
  .fab{bottom:28px;inset-inline-end:32px}
  .toast{bottom:32px!important}
}
.stat{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:12.5px;color:var(--ink-2);text-align:start;width:100%}
.stat b{display:block;color:var(--ink);font-size:13px}
.stat .lamp{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.stat .lamp.ok{background:var(--profit);box-shadow:0 0 0 4px var(--profit-soft)} .stat .lamp.err{background:var(--loss);box-shadow:0 0 0 4px var(--loss-soft)} .stat .lamp.busy{background:var(--info)}

/* ---------- Building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow)}
.pad{padding:18px} .pad-s{padding:12px 14px}
.stack>*+*{margin-top:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 10px;font-weight:700;font-size:15.5px}
.sec:first-child{margin-top:4px}
.sec .lnk{font-size:13px;font-weight:600;color:var(--brand);padding:4px 6px}
.lnk{color:var(--brand);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1px solid var(--line-2);background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.chip .c{font-size:11.5px;opacity:.75;background:color-mix(in srgb,currentColor 12%,transparent);padding:1px 7px;border-radius:9px}
.btn{height:46px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);transition:filter .15s,transform .1s;text-align:center}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.985)} .btn:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none}
.btn.sec2{background:var(--card);color:var(--brand);border-color:var(--line-2)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:transparent}
.btn.danger{background:var(--loss);border-color:var(--loss);color:#fff}
.btn.danger-o{background:transparent;color:var(--loss);border-color:color-mix(in srgb,var(--loss) 45%,transparent)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center} .row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.badge.wait{background:var(--wait-soft);color:var(--wait);border-color:transparent} .badge.pos{background:var(--profit-soft);color:var(--profit);border-color:transparent}
.badge.neg{background:var(--loss-soft);color:var(--loss);border-color:transparent} .badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--info-soft);color:var(--ink);font-size:13.5px;line-height:1.65}
.note .ic{color:var(--info);margin-top:2px}
.note.warn{background:var(--wait-soft)} .note.warn .ic{color:var(--wait)}
.note.bad{background:var(--loss-soft)} .note.bad .ic{color:var(--loss)}
.note.good{background:var(--profit-soft)} .note.good .ic{color:var(--profit)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-2)}
.empty .ic{margin:0 auto 12px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:16px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- Home ---------- */
.home-grid{display:grid;gap:14px}
@media (min-width:1000px){.home-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;gap:22px}.home-grid .sec:first-child{margin-top:0}}
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:22px 22px 18px 22px;padding-inline-end:46px;color:#F2F5F3;
  background:linear-gradient(160deg,#16524A 0%,#0E3A34 100%);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px),linear-gradient(160deg,#16524A 0%,#0E3A34 100%)}
[data-theme="dark"] .hero{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.05) 31px 32px),linear-gradient(160deg,#173F38 0%,#0D2622 100%)}
.hero::before{content:"";position:absolute;inset-block:0;inset-inline-end:24px;width:2px;background:var(--margin);opacity:.85}
.hero .lbl{font-size:13.5px;opacity:.8;font-weight:500}
.hero .big{font-size:clamp(40px,8vw,56px);font-weight:700;line-height:1.1;margin:6px 0 2px;letter-spacing:-.5px;color:#fff}
.hero .big.neg{color:#FFB4A8}
.hero .big .cur{color:rgba(255,255,255,.6);font-size:16px}
.eq{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.eq span{display:inline-flex;align-items:baseline;gap:5px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);padding:5px 10px;border-radius:10px;font-size:12.5px;color:rgba(255,255,255,.78)}
.eq span b{color:#fff;font-size:13.5px}
.eq i{font-style:normal;opacity:.55;font-weight:700}
.hero .pend{margin-top:12px;font-size:13px;color:#F8D592;display:flex;align-items:center;gap:6px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(112px,1fr));gap:10px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
.pipe::-webkit-scrollbar{display:none}
.stg{position:relative;text-align:start;padding:14px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;overflow:hidden}
.stg:hover{border-color:var(--c);transform:translateY(-1px)}
.stg::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--c)}
.stg .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stg .k i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.stg .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:6px}
.stg .m{font-size:12px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px 16px}
.kpi .v{font-size:22px;font-weight:700;line-height:1.3}
.kpi .t{font-size:12.5px;color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar .stack2{width:100%;max-width:30px;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar i{display:block;width:100%}
.bar i.d{background:var(--profit);border-radius:6px 6px 2px 2px} .bar i.p{background:var(--wait-soft);border:1.5px dashed var(--wait);border-bottom:0;border-radius:6px 6px 0 0}
.bar .v{font-size:10.5px;color:var(--ink-3);height:14px;white-space:nowrap} .bar .d0{font-size:11.5px;color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);padding:10px 4px 2px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;text-decoration:none;vertical-align:-1px}

/* ---------- Lists & order rows ---------- */
.list>*+*{border-top:1px solid var(--line)}
.att{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;transition:background .15s}
.att:hover,.oc:hover{background:var(--sunk)}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.ico.wait{background:var(--wait-soft);color:var(--wait)} .ico.neg{background:var(--loss-soft);color:var(--loss)} .ico.info{background:var(--info-soft);color:var(--info)} .ico.pos{background:var(--profit-soft);color:var(--profit)}
.att b{display:block;font-size:14px;font-weight:600} .att span{font-size:12.5px;color:var(--ink-3)}
.att .go{color:var(--ink-3);transform:scaleX(-1)}
.dayh{margin:20px 6px 8px;font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.2px}
.oc{display:flex;gap:14px;align-items:center;width:100%;padding:14px 16px;transition:background .15s}
.oc .main{flex:1;min-width:0;display:block}
.oc .t{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.oc .bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.oc .amt{text-align:end;font-weight:700;font-size:16.5px;flex:none;line-height:1.25}
.oc .amt small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-top:2px}
.trk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;direction:ltr;unicode-bidi:isolate}
/* delivery progress track */
.track{display:flex;align-items:center;gap:8px;margin-top:9px}
.track .seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:118px;flex:none}
.track .seg4 i{height:5px;border-radius:3px;background:var(--line)}
.track .seg4 i.on{background:var(--tc,var(--info))}
.track .tl2{font-size:12px;font-weight:600;color:var(--tc,var(--ink-2));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .raw{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative}
.search>span{position:absolute;inset-inline-start:14px;top:14px;color:var(--ink-3)}
.search input{padding-inline-start:42px;height:50px;border-radius:14px}
.more{display:block;width:100%;padding:14px;text-align:center;color:var(--brand);font-weight:600;font-size:14px}

/* ---------- Forms ---------- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field>small{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],input[type=search],input[type=tel],input[type=url],input:not([type]),select,textarea{
  width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);outline:0;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;min-height:80px;padding:10px 14px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
input[type=number],input.ltr,textarea.ltr{direction:ltr;text-align:right}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:disabled{background:var(--sunk);color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;height:46px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:48px;font-size:20px;color:var(--brand);font-weight:700;text-align:center}
.stepper button:active{background:var(--brand-soft)}
.stepper input{border:0;border-radius:0;text-align:center;box-shadow:none!important;padding:0}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0}
.sw+.sw{border-top:1px solid var(--line)}
.sw .tx{flex:1;min-width:0} .sw .tx b{display:block;font-weight:600;font-size:14.5px} .sw .tx span{font-size:12.5px;color:var(--ink-3)}
.sw input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:none}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:14px;background:var(--line-2);transition:background .18s}
.toggle i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked + i{background:var(--brand)}
.toggle input:checked + i::after{transform:translateX(-20px)}
.toggle input:focus-visible + i{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- Detail sheet ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.kv>span:first-child{color:var(--ink-2)}
.kv.tot{border-top:1px solid var(--line-2);margin-top:4px;padding-top:10px;font-weight:700;font-size:15px}
.kv.key{background:var(--brand-soft);margin:6px -18px -18px;padding:14px 18px;font-weight:700;border-radius:0 0 var(--r-m) var(--r-m)}
.kv.key>span:first-child{color:var(--brand)}
.receipt .kv{border-bottom:1px dashed var(--line)}

  chat:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/>', download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', upload:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',

const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('kanach', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = r.onblocked = () => res(false);
      } catch { res(false); }
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => { const t = this.db.transaction('kv', mode), st = t.objectStore('kv'), out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = t.onabort = () => rej(t.error); });
  },
  get(k) { return this.tx('readonly', st => st.get(k)); },
  setMany(obj) { return this.tx('readwrite', st => { Object.entries(obj).forEach(([k, v]) => st.put(v, k)); }); }
};

/* ---- تتبّع التغييرات لكل حركة: updatedAt + شواهد الحذف، لتُدمج المزامنة بدل أن تستبدل ---- */
const SIG = { e: new Map(), b: new Map() };
const sigOf = x => { const { updatedAt, ...r } = x; return JSON.stringify(r); };
function resetSigs() { SIG.e = new Map(S.entries.map(x => [x.id, sigOf(x)])); SIG.b = new Map(S.budgetExp.map(x => [x.id, sigOf(x)])); }
function stamp(list, sigs, tombs, now) {
  const seen = new Set();
  for (const x of list) { seen.add(x.id); const g = sigOf(x); if (sigs.get(x.id) !== g) { x.updatedAt = now; sigs.set(x.id, g); delete tombs[x.id]; } }
  for (const id of [...sigs.keys()]) if (!seen.has(id)) { sigs.delete(id); tombs[id] = now; }
  const cut = new Date(Date.now() - 90 * 864e5).toISOString();
  Object.keys(tombs).forEach(id => { if (tombs[id] < cut) delete tombs[id]; });
}

function calcVonder({ price, qty, myProfit, extra, seller, wid = 0, type = S.settings.defShip, fvFee, yalFee }) {
  const p = num(price), q = Math.max(1, parseInt(qty) || 1), mp = num(myProfit), ex = num(extra), sl = num(seller);
  const pct = num(S.settings.appFeePct) / 100, buffer = num(S.settings.fixedFee);
  const subtotal = p * q, appFee = subtotal * pct;
  const totalCost = subtotal + appFee + buffer + ex;
  const totalProfit = mp * q, finalPrice = totalCost + totalProfit, sellPrice = finalPrice + sl;
  const delivery = deliveryCost({ wid: +wid || 0, type, sellPrice, fvFee, yalFee });
  return { price:p, qty:q, subtotal, appFee, appFeePct: pct * 100, buffer, fixedFee: buffer, extra:ex, totalCost, myProfit:mp, totalProfit, seller:sl, finalPrice, sellPrice,
    delivery, netProfit: totalProfit + buffer - delivery.cost, customerPays: sellPrice + delivery.fv };
}

function computeStats(entries) {
  const orders = entries.filter(isOrder);
  const delivered = orders.filter(e => e.status === 'delivered'), pending = orders.filter(e => e.status === 'pending'), returned = orders.filter(e => e.status === 'returned');
  const deliveredProfit = sum(delivered, e => e.amount), pendingProfit = sum(pending, e => e.amount);
  const expenses = sum(entries.filter(e => e.type === 'expense'), e => e.amount);
  const ads = sum(entries.filter(e => e.type === 'ads'), e => e.amount);
  const returnLoss = sum(entries.filter(e => e.type === 'return'), e => e.amount);
  const net = deliveredProfit - expenses - ads - returnLoss;
  const decided = delivered.length + returned.length;
  return { orders, delivered, pending, returned, deliveredProfit, pendingProfit, expenses, ads, returnLoss, net,
    avg: delivered.length ? deliveredProfit / delivered.length : 0,
    deliveryRate: decided ? delivered.length / decided * 100 : 0,
    returnRate: orders.length ? returned.length / orders.length * 100 : 0 };
}

function buildCustomers() {
  const map = {};

    if (!isOrder(e) && e.type !== 'return') return;
    const y = e.yalidineInfo || {};
    const name = (y.clientName || (e.desc || '').replace(/^مرتجع:\s*/, '').replace(/طلبية|Vonder|Sonazone/gi, '').trim() || 'غير معروف');
    const phone = y.phone || ((e.desc || '').match(/0\d{9}/) || [''])[0];
    const key = phone || name.toLowerCase();
    const c = map[key] || (map[key] = { key, name, phone, wilaya:'', orders:0, delivered:0, returned:0, profit:0, loss:0, last:'' });
    if (y.wilaya) c.wilaya = y.wilaya; if (y.clientName && !c.named) { c.name = y.clientName; c.named = true; }
    if (isOrder(e)) {
      c.orders++; if (e.status === 'delivered') { c.delivered++; c.profit += e.amount || 0; } if (e.status === 'returned') c.returned++;

}

/* ترحيل v5: «الحماية 400» كانت تقريباً لفرق التوصيل — تُستبدل بالحساب الحقيقي، وتُصحَّح الطلبيات المسجّلة (مع إمكانية التراجع) */

const expectedValue = (profit, rate, taxe) => rate * profit - (1 - rate) * taxe;

/* ---- تحقّق: هل Net الحقيقي من Yalidine يطابق النموذج (سعر الزبون + توصيل FreeVendor − توصيل Yalidine − 0.75%)؟ ---- */
function calibrateFees() {

  const rows = S.entries.filter(e => e.type === 'vonder' && e.status === 'delivered' && e.isActualProfit && ['excel', 'api', 'manual'].includes(netSourceOf(e)) && e.sellPrice > 0 && e.netClient > 0 && wilayaOfEntry(e))

  if (p.price > 0) {

    const first = norm(p.name).split(' ')[0];

function deriveNet(p) {
  if (p.netExact > 0) return { net: p.netExact, src: p.source === 'excel' ? 'excel' : 'api' };
  const c = S.carrier;
  if (p.source === 'excel' || c.netMode === 'none' || !(p.price > 0)) return { net: 0, src: '' };

  const net = p.price - p.deliveryFee - p.price * num(S.settings.codPct) / 100 - num(c.extraFixed) - p.price * num(c.extraPct) / 100;

async function syncCarrier({ manual = true } = {}) {
  if (ui.syncing) return;
  if (!Carrier.configured()) { if (manual) { toast('اربط Yalidine أولاً لتحديث الطلبيات تلقائياً.'); go('carrier'); } return; }
  const targets = syncTargets();
  if (!targets.length) { S.carrier.lastSync = new Date().toISOString(); saveCarrier(); if (manual) toast('لا توجد طلبيات بأرقام تتبع تحتاج متابعة.'); render(); return; }
  ui.syncing = true; render();
  try {
    const found = await Carrier.fetchByTracking(targets.map(e => cleanTrack(e.tracking)));
    const parcels = [...found.values()];
    const changes = buildChanges(parcels, p => {
      const pTrack = cleanTrack(p.tracking).toLowerCase();
      const e = targets.find(x => cleanTrack(x.tracking).toLowerCase() === pTrack);
      return e ? { entry: e, method:'رقم التتبع', conf:'high' } : null;
    });
    const missing = targets.filter(e => !found.has(cleanTrack(e.tracking).toLowerCase())).length;
    let res;
    if (S.carrier.auto) {
      res = applyChanges(changes.filter(c => c.entry && (c.kind === 'info' || c.apply || c.kind === 'none')));
      ui.review = changes.filter(c => c.kind === 'conflict').length ? { source:'api', changes: changes.filter(c => c.kind === 'conflict') } : null;
    } else {
      res = applyChanges(changes.filter(c => c.kind === 'info' || c.kind === 'none'));
      const fin = changes.filter(c => ['deliver','return','net','conflict'].includes(c.kind));
      ui.review = fin.length ? { source:'api', changes: fin } : null;
    }
    S.carrier.lastSync = new Date().toISOString(); S.carrier.lastError = ''; ui.errShown = false;
    S.carrier.log = [{ ts: S.carrier.lastSync, checked: targets.length, missing, ...res, pending: ui.review?.changes.length || 0, manual }, ...(S.carrier.log || [])].slice(0, 20);
    saveCarrier(); persist();
    const bits = []; if (res.delivered) bits.push(`${res.delivered} مُسلَّمة`); if (res.returned) bits.push(`${res.returned} مرتجعة`); if (res.netFixed) bits.push(`${res.netFixed} Net محدَّث`);
    if (ui.review?.changes.length && !S.carrier.auto) bits.push(`${ui.review.changes.length} بانتظار موافقتك`);
    const eventful = !!(res.delivered || res.returned || res.netFixed || ui.review?.changes.length);
    if (missing) bits.push(`${missing} رقم تتبع غير موجود عند Yalidine`);
    if (bits.length) toast(`تحديث Yalidine: ${bits.join(' • ')}`, S.carrier.undo && S.carrier.auto ? { action:{ label:'تراجع', fn: () => { undoLastSync(); commit(); toast('تم التراجع عن آخر تحديث.'); } } } : {});
    else if (manual) toast(`تمت المتابعة: ${targets.length} طلبية — لا جديد.`);
    if (eventful) { const b = []; if (res.delivered) b.push(`${res.delivered} تسليم`); if (res.returned) b.push(`${res.returned} مرتجع`); if (res.netFixed) b.push(`${res.netFixed} Net`); if (ui.review?.changes.length) b.push(`${ui.review.changes.length} بانتظار المراجعة`); pingUpdate('كناش — تحديث من Yalidine', b.join(' • ')); }
  } catch (err) {
    S.carrier.lastError = err.message; S.carrier.lastErrorAt = new Date().toISOString();
    S.carrier.log = [{ ts: new Date().toISOString(), error: err.message, manual }, ...(S.carrier.log || [])].slice(0, 20); saveCarrier();
    if (manual || err.kind !== 'rate' && !ui.errShown) { ui.errShown = true; toast(err.message || 'فشل التحديث', { tone:'bad' }); }
  } finally { ui.syncing = false; render(); }
}

let audioCtx = null;
function playChime() {
  if (!S.settings.soundAlert) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [[880, t0, 0.14], [1318.5, t0 + 0.1, 0.22]].forEach(([freq, start, dur]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(0.22, start + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.start(start); o.stop(start + dur + 0.02);
    });
  } catch {}
  if (navigator.vibrate && navigator.userActivation?.hasBeenActive) try { navigator.vibrate([40, 30, 40]); } catch {}
}

const C128 = '11011001100110011011001100110011010010011000100100011001000100110010011001000100110001001000110010011001001000110010001001100010010010110011100100110111001001100111010111001100100111011001001110011011001110010110010111001100100111011011100100110011101001110110111011101001100111001011001110010011011101100100111001101001110011001011011011000110110001101100011011010100011000100010110001000100011010110001000100011010001000110001011010001000110001010001100010001010110111000101100011101000110111010111011000101110001101000111011011101110110110100011101100010111011011101000110111000101101110111011101011000111010001101110001011011101101000111011000101110001101011101111010110010000101111000101010100110000101000011001001011000010010000110100001011001000010011010110010000101100001001001101000010011000010100001101001000011001011000010010110010100001111011101011000010100100011110101010011110010010111100100100111101011110010010011110100100111100101111010010011110010100111100100101101101111011011110110111101101101010111100010100011110100010111101011110100010111100010111101010001111010001010111011110101111011101110101111011110101110110100001001101001000011010011100'.match(/.{11}/g), C128_STOP = '1100011101011';

    wid: '', shipType: s.defShip, phone: '', cname: '', paste: '' };
}
function draftFromEntry(e) {
  const d = newDraft(e.type); d.id = e.id; d.date = e.date; d.desc = e.desc || ''; d.tracking = e.tracking || ''; d.product = e.product || ''; d.status = e.status === 'delivered' ? 'delivered' : 'pending';
  d.wid = wilayaOfEntry(e) || ''; d.shipType = e.ship?.type || S.settings.defShip; d.phone = phoneOfEntry(e); d.cname = e.yalidineInfo?.clientName || '';

  else if (e.type === 'sonazone') { d.buy = e.sonaBuyPrice; d.sell = e.sonaSellPrice; d.sqty = e.sonaQuantity || 1; }

const LABEL_RE = /^\s*(?:الاسم(?: الكامل)?|الإسم|اسم|nom(?: complet)?|name|pr[ée]nom|الولاية|ولاية|wilaya|البلدية|بلدية|commune|العنوان|adresse|address|الهاتف|رقم الهاتف|التلفون|tel|t[ée]l[ée]phone|phone|المنتج|produit|الكمية|quantit[ée])\s*[:：\-–]?\s*/i;
const GREET_RE = /(سلام|السلام|مرحبا|صباح|مساء|نحب|نحوس|بغيت|حاب|نطلب|من فضلك|عافاك|شكرا|بارك|salam|bonjour|bonsoir|merci|svp|commande|je veux|hello|hi\b)/i;
function parseCustomerMsg(t) {
  const txt = String(t || '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0);
  const out = {};
  const pm = txt.match(/(?:\+?213|00213|0)[\s.\-]*([5-7](?:[\s.\-]*\d){8})/); if (pm) out.phone = '0' + pm[1].replace(/\D/g, '');
  const lines = txt.split(/\n|،|,|\|/).map(raw => { const m = raw.match(LABEL_RE); return { label: m ? norm(m[0]) : '', v: raw.replace(LABEL_RE, '').trim() }; }).filter(x => x.v);
  for (const { label, v } of lines) {
    if (!out.wid && !/\d{6,}/.test(v)) { const w = wilayaIdOf(v, !/wilaya|ولاية/.test(label)); if (w && (/wilaya|ولاية/.test(label) || wilayaIdOf(v, true))) { out.wid = w; continue; } }
    if (!out.name && !/\d/.test(v) && !GREET_RE.test(v) && v.split(/\s+/).length <= 4 && v.length >= 3 && v.length <= 40 && !/(بلدية|commune|عنوان|adresse|منتج|produit)/.test(label) && !wilayaIdOf(v, true)) out.name = v.replace(/\s+/g, ' ');
  }
  return out;
}

function handleRestore(file) {

  const rows = buildCustomers().map(c => ({ الاسم: c.name, الهاتف: c.phone, الولاية: c.wilaya, الطلبيات: c.orders, 'مُسلَّمة': c.delivered, مرتجعة: c.returned, 'الفائدة المحققة': Math.round(c.profit), التصنيف: rateCustomer(c).t, 'آخر طلبية': fmtDate(c.last) }));
  if (!rows.length) { toast('لا يوجد عملاء'); return; }
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'العملاء'); XLSX.writeFile(wb, `كناش-عملاء-${iso()}.xlsx`);
}

let cloudTimer = null, cloudPollTimer = null;
const CLOUD = { busy: false, again: false, dirty: false };
const cloudReady = () => !!(localStorage.getItem(LS.jbKey) && localStorage.getItem(LS.jbId));
function initCloud() {
  cloudHook = () => { if (!cloudReady()) return; CLOUD.dirty = true; clearTimeout(cloudTimer); ui.cloud = 'busy'; cloudTimer = setTimeout(() => { cloudTimer = null; cloudSync(); }, 3000); };
  if (cloudReady()) cloudSync();
  scheduleCloudPoll();
}
document.addEventListener('visibilitychange', () => {
  if (!cloudReady()) return;
  if (document.visibilityState === 'hidden' && CLOUD.dirty) { clearTimeout(cloudTimer); cloudTimer = null; cloudSync(); }
  else if (document.visibilityState === 'visible') cloudSync();
});
function scheduleCloudPoll() { clearInterval(cloudPollTimer); if (cloudReady()) cloudPollTimer = setInterval(() => { if (document.visibilityState === 'visible') cloudSync(); }, 90000); }
async function jbCall(method, body) {
  const id = localStorage.getItem(LS.jbId), key = localStorage.getItem(LS.jbKey);
  const res = await fetch(`https://api.jsonbin.io/v3/b/${id}${method === 'GET' ? '/latest' : ''}`, { method, headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Meta': 'false' }, body: body ? JSON.stringify(body) : undefined, keepalive: method === 'PUT' && !!body && JSON.stringify(body).length < 60000 });
  if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json();
}
/* دمج سجلّين بالمعرّف: الأحدث updatedAt يفوز، وشاهد الحذف الأحدث يحذف */
function mergeById(local, remote, tombs) {
  const m = new Map();
  (remote || []).forEach(x => x && x.id != null && m.set(x.id, x));
  (local || []).forEach(x => { const r = m.get(x.id); if (!r || (x.updatedAt || '') >= (r.updatedAt || '')) m.set(x.id, x); });
  Object.entries(tombs).forEach(([id, ts]) => { const x = m.get(id); if (x && (x.updatedAt || '') <= ts) m.delete(id); });
  return [...m.values()];
}
const mergeTombs = (a = {}, b = {}) => { const o = { ...a }; Object.entries(b).forEach(([k, v]) => { if (!o[k] || v > o[k]) o[k] = v; }); return o; };
const stateKey = d => JSON.stringify([(d.entries || []).map(x => x.id + '@' + (x.updatedAt || '')).sort(), (d.budgetExp || []).map(x => x.id + '@' + (x.updatedAt || '')).sort(), Object.keys(d.deleted || {}).sort(), Object.keys(d.deletedB || {}).sort(), Object.entries(d.budgets || {}).sort(), Object.entries(d.catalog || {}).map(([k, v]) => k + '@' + v.updatedAt).sort()]);
const byNewest = (a, b) => String(b.timestamp || b.date || '').localeCompare(String(a.timestamp || a.date || ''));
function applyMerged(remote) {
  const before = stateKey(S);
  S.deleted = mergeTombs(S.deleted, remote.deleted); S.deletedB = mergeTombs(S.deletedB, remote.deletedB);
  S.entries = mergeById(S.entries, remote.entries, S.deleted).sort(byNewest);
  S.budgetExp = mergeById(S.budgetExp, remote.budgetExp, S.deletedB);
  S.budgets = { ...(remote.budgets || {}), ...S.budgets };
  Object.entries(remote.catalog || {}).forEach(([k, v]) => { if (!S.catalog[k] || (v.updatedAt || '') > (S.catalog[k].updatedAt || '')) S.catalog[k] = v; });
  resetSigs();
  return stateKey(S) !== before;
}
/* مزامنة واحدة: اسحب ← ادمج ← ارفع فقط إن كان عندنا ما ليس في السحابة */
async function cloudSync({ manual = false } = {}) {
  if (!cloudReady()) { if (manual) toast('أدخل بيانات JSONBin أولاً', { tone: 'bad' }); return; }
  if (CLOUD.busy) { CLOUD.again = true; return; }
  CLOUD.busy = true; ui.cloud = 'busy'; if (manual) render();
  try {
    const remote = await jbCall('GET'), hasRemote = Array.isArray(remote?.entries);
    const changedHere = hasRemote ? applyMerged(remote) : false;
    if (changedHere) { writeLocal(); if (remote.device && remote.device !== deviceId()) pingUpdate('كناش', 'وصل تحديث من جهاز آخر'); }
    const mine = { entries: S.entries, budgetExp: S.budgetExp, budgets: S.budgets, deleted: S.deleted, deletedB: S.deletedB, catalog: S.catalog };
    if (!hasRemote || stateKey(mine) !== stateKey(remote)) {
      const stamp = new Date().toISOString();
      await jbCall('PUT', { ...mine, updatedAt: stamp, device: deviceId(), v: 4 });
      localStorage.setItem(LS.cloudSeen, stamp);
    }
    CLOUD.dirty = false;
    ui.cloud = 'ok'; ui.cloudMsg = `متزامن • ${S.entries.length} حركة • ${new Date().toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit' })}`;
    if (manual) toast('تمت المزامنة');
    if (changedHere || manual) render(); else updateCloudBadge();
  } catch (e) {
    ui.cloud = 'err'; ui.cloudMsg = 'فشلت المزامنة — تحقّق من المفتاح والمعرّف والإنترنت'; if (manual) toast(ui.cloudMsg, { tone: 'bad' }); updateCloudBadge();
  } finally {
    CLOUD.busy = false;
    if (CLOUD.again) { CLOUD.again = false; setTimeout(() => cloudSync(), 500); }
  }
}
function updateCloudBadge() { const b = $('#btnCloud'); if (b) b.innerHTML = `${ic('cloud')}<i class="dot ${ui.cloud}"></i>`; }
/* استبدال كامل بنسخة السحابة (زر «تحميل الآن» فقط) */
async function cloudReplace() {
  try {
    const j = await jbCall('GET'); if (!Array.isArray(j.entries)) throw new Error('empty');
    S.entries = j.entries; S.budgetExp = j.budgetExp || []; S.budgets = j.budgets || {}; S.deleted = j.deleted || {}; S.deletedB = j.deletedB || {}; S.catalog = j.catalog || S.catalog;
    resetSigs(); writeLocal(); CLOUD.dirty = false; ui.cloud = 'ok'; ui.cloudMsg = `مُستبدلة من السحابة • ${S.entries.length} حركة`; toast('تم التحميل من السحابة');
  } catch { ui.cloud = 'err'; ui.cloudMsg = 'فشل التحميل'; toast(ui.cloudMsg, { tone: 'bad' }); }
  render();
}
function deviceId() { let d = localStorage.getItem(LS.device); if (!d) { d = uid(); localStorage.setItem(LS.device, d); } return d; }

function buildContext() {
  const st = computeStats(S.entries), m = computeStats(S.entries.filter(e => inRange(e, periodRange('month'))));
  const byW = {}; S.entries.filter(Q.returned).forEach(e => { const w = e.yalidineInfo?.wilaya; if (w) byW[w] = (byW[w] || 0) + 1; });
  const topW = Object.entries(byW).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `بيانات صاحب المتجر (كناش — تتبع طلبيات Vonder/FreeVendor عبر Yalidine):
الإجمالي: ${st.orders.length} طلبية، ${st.delivered.length} مُسلَّمة، ${st.pending.length} معلّقة، ${st.returned.length} مرتجعة.
صافي الفائدة الكلي: ${Math.round(st.net)} دج. هذا الشهر: ${Math.round(m.net)} دج (${m.delivered.length} مُسلَّمة، نسبة مرتجع ${Math.round(m.returnRate)}%).
متوسط الفائدة للطلبية المُسلَّمة: ${Math.round(st.avg)} دج.
أكثر الولايات مرتجعاً: ${topW.map(([w, n]) => `${w} (${n})`).join('، ') || 'لا بيانات'}.
أجب بالدارجة الجزائرية، مختصر ومباشر، بالأرقام الموجودة فقط دون اختراع أي رقم.`;
}
async function sendChat() {
  const inp = $('#chatIn'), q = inp.value.trim(); if (!q) return;
  const key = localStorage.getItem(LS.apiKey);
  ui.chat.push({ r: 'u', t: q }); inp.value = ''; render();
  if (!key) { ui.chat.push({ r: 'a', t: 'أضف مفتاح Claude API من الإعدادات لتفعيل الإجابة.' }); render(); return; }
  ui.chat.push({ r: 'a', t: '…' }); render();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-beta': 'server-side-fallback-2026-07-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 2000, output_config: { effort: 'low' }, fallbacks: 'default', system: buildContext(), messages: ui.chat.filter(m => m.t !== '…').slice(-10).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t })) }) });
    const j = await res.json();
    ui.chat.pop();
    if (!res.ok) throw new Error(j?.error?.message || 'خطأ في الاتصال');
    if (j.stop_reason === 'refusal') throw new Error('رفض المساعد هذا السؤال — أعد صياغته.');
    const txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n') || 'لم أفهم، عاود السؤال.';
    ui.chat.push({ r: 'a', t: txt });
  } catch (err) { ui.chat.pop(); ui.chat.push({ r: 'a', t: 'تعذّر الاتصال: ' + err.message }); }
  render();
}

async function boot() {
  document.documentElement.setAttribute('data-theme', localStorage.getItem(LS.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  await loadAll();
  const mig = migrateV5(); migrateV6();
  if (/^https?:$/.test(location.protocol)) {
    try { const r = await fetch('/__kanach', { cache: 'no-store' }); const j = await r.json(); SAME_ORIGIN_PROXY = j?.kanach === 'proxy'; } catch {}
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  
  /* تصحيح تلقائي لحقل الـ proxy المسجل سابقاً في التخزين المحلي */
  if (S.carrier.proxy) {
    S.carrier.proxy = S.carrier.proxy.replace(/\/+(wilayas|parcels|histories|communes|centers)\b.*$/i, '').replace(/\s+/g, '').trim();
    saveCarrier();
  }

  let fixed = 0;
  S.entries.forEach(e => {
    if (e.tracking) {
      const c = cleanTrack(e.tracking);
      if (c !== e.tracking) { e.tracking = c; fixed++; }
    }
  });
  if (fixed) persist();

  if (!('adsPaused' in (readJSON(LS.settings, {}) || {}))) { S.settings.adsPaused = !S.entries.some(e => e.type === 'ads'); saveSettings(); }
  render();
  if (mig?.n) toast(`صُحِّحت فائدة ${mig.n} طلبية بأسعار التوصيل الحقيقية: ${mig.delta >= 0 ? 'زادت' : 'نقصت'} بـ ${fmtNum(Math.abs(mig.delta))} دج — التفاصيل في الإعدادات`, { action: { label: 'عرض', fn: () => go('settings', { scrollTo: 'sec-fees' }) } });
  initCloud();
  scheduleAutoSync();
  detectKanachProxy().then(() => { scheduleInbox(); if (ui.tab === 'settings') render(); });
  if (Carrier.configured()) setTimeout(() => syncCarrier({ manual: false }), 1200);
  document.addEventListener('visibilitychange', () => {
    const m = num(S.carrier.interval);
    if (document.visibilityState === 'visible' && m > 0 && Carrier.configured() && (!S.carrier.lastSync || Date.now() - new Date(S.carrier.lastSync) > m * 60000)) syncCarrier({ manual: false });
  });
}
boot();
